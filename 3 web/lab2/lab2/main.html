<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>ЛР 2 ВЕБ</title>
    <link rel="stylesheet" href="styles.css">


</head>
<body>

<header class="header">
    Недовба Дмитрий Андреевич P3209 320900
</header>

<table>
    <tr>
        <td>
            <canvas id="canvas" width="500" height="500">
                :(
            </canvas>
        </td>

        <td>
            <form id="inputXYZform">

                X:
                <select name="x" id="x">
                    <option value="-3">-3</option>
                    <option value="-2">-2</option>
                    <option value="-1">-1</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>


                <br>
                <label for="y">Y:</label>
                <input id="y" type="text" name="y"/>
                <br>

                R:
                <select name="r" id="r">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <br>
                <input type="submit" value="Ввод"/>
                <div id="error_message" class="error_message"></div>
            </form>

        </td>

    </tr>
</table>
<table id="result-table" class="result-table">
    <tr>
        <th>X</th>
        <th>Y</th>
        <th>R</th>
        <th>Результат</th>
        <th>Текущее время</th>
        <th>Время выполнения</th>
    </tr>
</table>
<script src="script.js"></script>
<script src="canvas.js"></script>
</body>


</html>
